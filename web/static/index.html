<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1b1c22">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vivid Mistress">
  <title>Vivid Mistress</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <!-- Single always-on chat view -->
    <main id="main" class="view">
      <!-- Top bar -->
      <header id="app-header">
        <div class="app-brand">Vivid Mistress</div>
        <div class="header-spacer"></div>
        <button id="btn-voice" class="voice-toggle" title="Toggle spoken (mp3) replies" aria-pressed="true">&#128266;</button>
      </header>

      <!-- Status bar: role / voice / speed (external names only) -->
      <div id="status-bar" class="status-bar">
        <span id="role-chip" class="status-chip" title="Current role. Type 'role' to list roles.">Role: —</span>
        <span id="voice-chip" class="status-chip" title="Current voice. Type 'voice' to list voices.">Voice: —</span>
        <span id="speed-chip" class="status-chip" title="Speech speed. Type 'speed &lt;1-9&gt;' to change.">Speed: —</span>
      </div>

      <!-- Messages -->
      <div id="chat-messages" class="chat-messages">
        <div class="empty-state" id="empty-state">
          <h2>Vivid Mistress</h2>
          <p>Say hello to start a conversation.<br>Type "help" for the available commands.</p>
        </div>
      </div>

      <!-- Input Area -->
      <div id="input-area">
        <div id="suggestion-buttons" class="suggestion-buttons hidden"></div>
        <div class="composer">
            <button id="btn-mic" class="btn-mic" title="Voice input">MIC</button>
          <textarea id="input-message" rows="1" placeholder="Message Vivid Mistress… (Enter to send, Shift+Enter for a new line)"></textarea>
          <button id="btn-send" class="btn btn-primary">Send</button>
        </div>
      </div>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
